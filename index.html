// 3. Web Audio 電競合成音效引擎 (免外部音檔，純合成機械鍵盤與電競回饋音)
// ============================================================================
class CyberSoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  init() {
    if (!this.ctx && typeof window !== 'undefined') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playClick() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(650, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.035);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.04);
  }

  playHit(combo = 1) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const baseFreq = Math.min(440 + combo * 28, 1200);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.4, now + 0.09);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.11);
  }

  playLaser() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(920, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  playError() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.setValueAtTime(125, now + 0.08);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.23);
  }

  playFanfare() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, idx) => {
      const now = this.ctx.currentTime + idx * 0.09;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.24);
    });
  }
}

// ============================================================================
// 4. 智慧交叉比對演算法 (Wagner-Fischer / Damerau-Levenshtein LCS 對齊)
//    100% 還原影片 04:53 的符號系統：
//    `*` 打錯、`-` 漏打、`+` 多打、`@@` 顛倒打字、`←` 或 `▽` 最後打字位置
// ============================================================================
function analyzeSmartLineDiff(targetLine, typedLine, isLastTypedLine = false) {
  const T = Array.from(targetLine || '');
  const U = Array.from(typedLine || '');
  const m = T.length;
  const n = U.length;

  // 若完全未輸入該行
  if (n === 0) {
    return {
      targetText: targetLine,
      typedText: '',
      markerLine: '',
      alignedTypedLine: '',
      correct: 0,
      wrong: 0,
      missing: 0,
      extra: 0,
      transposed: 0,
      score: 0,
      tokens: []
    };
  }

  // 在逐行看打中，若該行是最後一行且尚未打完，只比對到學生目前打到的對應範圍（不將後面未打完的字算作漏打）
  // 但若已經換行（非最後一行），則整行未打完的部分算漏打，或者智慧截斷尾端未打部分
  const effectiveM = isLastTypedLine ? Math.min(m, Math.max(n, Math.min(m, n + 2))) : m;
  const subT = T.slice(0, effectiveM);

  const dp = Array.from({ length: effectiveM + 1 }, () => Array(n + 1).fill(0));
  for (let i = 0; i <= effectiveM; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;

  for (let i = 1; i <= effectiveM; i++) {
    for (let j = 1; j <= n; j++) {
      if (subT[i - 1] === U[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
      } else {
        dp[i][j] = 1 + Math.min(
          dp[i - 1][j - 1], // 替換 (打錯 *)
          dp[i - 1][j],     // 刪除 (漏打 -)
          dp[i][j - 1]      // 插入 (多打 +)
        );
      }
    }
  }

  // 回溯找出對齊操作序列
  let i = effectiveM;
  let j = n;
  const ops = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && subT[i - 1] === U[j - 1]) {
      ops.push({ type: 'match', tChar: subT[i - 1], uChar: U[j - 1] });
      i--;
      j--;
    } else if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + 1) {
      ops.push({ type: 'sub', tChar: subT[i - 1], uChar: U[j - 1] });
      i--;
      j--;
    } else if (j > 0 && (i === 0 || dp[i][j] === dp[i][j - 1] + 1)) {
      ops.push({ type: 'extra', tChar: ' ', uChar: U[j - 1] });
      j--;
    } else {
      ops.push({ type: 'missing', tChar: subT[i - 1], uChar: '-' });
      i--;
    }
  }
  ops.reverse();

  // 偵測相鄰顛倒錯字 (`@@`)：若連續兩個 sub 且互為顛倒 (t1===u2 && t2===u1)
  for (let k = 0; k < ops.length - 1; k++) {
    if (
      ops[k].type === 'sub' &&
      ops[k + 1].type === 'sub' &&
      ops[k].tChar === ops[k + 1].uChar &&
      ops[k + 1].tChar === ops[k].uChar
    ) {
      ops[k].type = 'transposed';
      ops[k + 1].type = 'transposed';
      k++;
    }
  }

  let correct = 0;
  let wrong = 0;
  let missing = 0;
  let extra = 0;
  let transposed = 0;

  let alignedTargetStr = '';
  let alignedTypedStr = '';
  const tokens = [];

  ops.forEach((op) => {
    if (op.type === 'match') {
      correct++;
      alignedTargetStr += op.tChar;
      alignedTypedStr += op.uChar;
      tokens.push({ ...op, symbol: ' ' });
    } else if (op.type === 'transposed') {
      wrong++;
      transposed++;
      alignedTargetStr += op.tChar;
      alignedTypedStr += '@';
      tokens.push({ ...op, symbol: '@' });
    } else if (op.type === 'sub') {
      wrong++;
      alignedTargetStr += op.tChar;
      alignedTypedStr += '*';
      tokens.push({ ...op, symbol: '*' });
    } else if (op.type === 'missing') {
      missing++;
      alignedTargetStr += op.tChar;
      alignedTypedStr += '-';
      tokens.push({ ...op, symbol: '-' });
    } else if (op.type === 'extra') {
      extra++;
      alignedTargetStr += ' ';
      alignedTypedStr += '+';
      tokens.push({ ...op, symbol: '+' });
    }
  });

  // 補上最後一行未打完的原題目字元供對照顯示
  if (effectiveM < m) {
    const rest = T.slice(effectiveM).join('');
    alignedTargetStr += rest;
    if (isLastTypedLine) {
      alignedTypedStr += '←';
    }
  } else if (isLastTypedLine) {
    alignedTypedStr += '←';
  }

  const lineScore = Math.max(0, correct - wrong - missing - extra);

  return {
    targetText: alignedTargetStr,
    typedText: typedLine,
    alignedTypedLine: alignedTypedStr,
    correct,
    wrong,
    missing,
    extra,
    transposed,
    score: lineScore,
    tokens
  };
}

// 5. 虛擬鍵盤與雙手十指視覺引導元件 (支援英打、大小寫 Shift 與中打注音)
// ============================================================================
function CyberVirtualKeyboard({ targetChar, lang, lastWrongKey }) {
  const keyInfo = targetChar ? CHAR_TO_KEY_MAP[targetChar] : null;
  const activeCode = keyInfo ? keyInfo.code : null;
  const activeShiftCode = keyInfo && keyInfo.needShift ? keyInfo.shiftKey : null;
  const activeFinger = keyInfo ? FINGER_META[keyInfo.finger] : null;

  return (
    <div className="w-full select-none">
      {/* 虛擬鍵盤主體 */}
      <div className="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 sm:p-4 shadow-2xl backdrop-blur-md">
        <div className="flex flex-col gap-1.5 items-center">
          {KEYBOARD_ROWS.map((row, rIdx) => (
            <div key={rIdx} className="flex gap-1.5 justify-center w-full">
              {row.map((k) => {
                const fMeta = FINGER_META[k.finger];
                const isTarget = k.code === activeCode || k.code === activeShiftCode;
                const isWrong = lastWrongKey && (k.main.toLowerCase() === lastWrongKey.toLowerCase() || k.zh === lastWrongKey);

                return (
                  <div
                    key={k.code}
                    className={`relative h-11 sm:h-12 ${k.w} rounded-lg border flex flex-col justify-between p-1.5 transition-all duration-150 ${
                      isTarget
                        ? `${fMeta.activeBg} scale-105 z-10 font-extrabold ring-2 ring-white`
                        : isWrong
                        ? 'bg-rose-600 text-white border-rose-300 animate-pulse scale-95'
                        : `${fMeta.color} hover:brightness-125`
                    }`}
                  >
                    <div className="flex justify-between items-start w-full leading-none">
                      <span className="text-[11px] sm:text-xs font-mono opacity-85">{k.main}</span>
                      {k.zh && (
                        <span className={`text-[11px] sm:text-xs font-bold ${lang === 'zh-bopomofo' ? 'scale-110 text-cyan-200' : 'opacity-65'}`}>
                          {k.zh}
                        </span>
                      )}
                    </div>
                    {k.shift && k.main.length === 1 && !/^[A-Z]$/.test(k.main) && (
                      <span className="text-[10px] opacity-60 leading-none">{k.shift}</span>
                    )}
                    {/* F 與 J 定位凸起橫槓 */}
                    {k.bump && (
                      <div className={`w-3.5 h-0.5 mx-auto rounded-full ${isTarget ? 'bg-slate-950' : 'bg-white/70'}`} />
                    )}
                    {/* 擊鍵目標準星指示 */}
                    {isTarget && (
                      <span className="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 rounded-full bg-white text-slate-950 flex items-center justify-center text-[9px] font-black shadow">
                        ●
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>

        {/* 下方十指色彩編碼對應列 (還原影片底部：小指 無名指 中指 食指 大拇指 食指 中指 無名指 小指) */}
        <div className="mt-3 pt-2.5 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div className="flex items-center gap-1.5 sm:gap-2 mx-auto">
            {[
              FINGER_META.L_PINKY,
              FINGER_META.L_RING,
              FINGER_META.L_MIDDLE,
              FINGER_META.L_INDEX,
              FINGER_META.THUMB,
              FINGER_META.R_INDEX,
              FINGER_META.R_MIDDLE,
              FINGER_META.R_RING,
              FINGER_META.R_PINKY
            ].map((f, idx) => {
              const isCurrentFinger = activeFinger && activeFinger.id === f.id;
              return (
                <div
                  key={idx}
                  className={`px-2.5 py-1 rounded-md border text-xs font-bold transition-all flex items-center gap-1.5 ${
                    isCurrentFinger
                      ? `${f.activeBg} scale-110 ring-2 ring-white`
                      : `${f.badgeBg} opacity-75`
                  }`}
                >
                  <span className="w-2 h-2 rounded-full" style={{ backgroundColor: f.dotColor }} />
                  <span>{f.short}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

          {rightFingers.map((f) => {

            return (
              <g key={f.id}>
                <rect
                  x={f.x - 6}
                  y={f.y}
                  width="12"

                  rx="6"
                  className={isActive ? 'fill-slate-700 stroke-white' : 'fill-slate-800 stroke-slate-600'}

                />

                  <>

function App() {
  // 導覽畫面狀態：'splash' (啟動連線選擇) | 'hub' (四大模式戰術大廳) | 'key_drill' (鍵盤遊戲) | 'word_drill' (字例練習) | 'space_game' (打字遊戲) | 'timed_exam' (計時測驗)
  const [screen, setScreen] = useState('splash');

  // 音效開關
  const [muted, setMuted] = useState(false);
  const toggleMute = () => {
    soundEngine.muted = !muted;
    setMuted(!muted);
  };

  // 題庫動態載入管理狀態 (同目錄 manifest.json 與各別題庫 JSON)
  const [manifest, setManifest] = useState(DEFAULT_MANIFEST);
  const [banks, setBanks] = useState(EMBEDDED_BANKS);
  const [loadStatus, setLoadStatus] = useState({ mode: 'hybrid', loadedFiles: 6, lastSync: '同目錄題庫已就緒' });
  const [showBankModal, setShowBankModal] = useState(false);

  // 當前選中的主分類與子課程
  const [selectedCatId, setSelectedCatId] = useState('en_finger');
  const [selectedLessonId, setSelectedLessonId] = useState('Q-1');

  // 方案 C 預留：師生連線與學生個人資訊狀態
  const [connectionMode, setConnectionMode] = useState('standalone'); // 'standalone' | 'teacher_sync'
  const [studentProfile, setStudentProfile] = useState({
    classId: '601',
    seatNo: '01',
    name: '電競學員',
    serverUrl: 'ws://192.168.1.100:8080/cybertype-classroom',
    roomCode: 'EDU-2026'
  });
  const [showTeacherPanel, setShowTeacherPanel] = useState(false);
  const [scoreHistory, setScoreHistory] = useState(() => {
    try {
      const saved = localStorage.getItem('cybertype_scores_v2');
      return saved ? JSON.parse(saved) : [
        { id: 'demo-1', timestamp: '11:26:05', student: '601-01 電競學員', mode: '鍵盤遊戲', lesson: 'Q-5s', speed: '22 鍵/分', errorRate: '0%', score: 100, synced: true },
        { id: 'demo-2', timestamp: '11:28:40', student: '601-01 電競學員', mode: '打字遊戲', lesson: 'Q-5g3', speed: '18 字/分', errorRate: '10%', score: 432, synced: true }
      ];
    } catch {
      return [];
    }
  });

  // 嘗試從同目錄動態載入 ./manifest.json 與各題庫檔案 (若在真實網頁伺服器環境會自動讀取最新檔案)
  const probeSameDirectoryFiles = useCallback(async () => {
    try {
      const manifestUrl = ['.', 'manifest.json'].join('/');
      const res = await window.fetch(manifestUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('Sandbox environment');
      const remoteManifest = await res.json();
      if (remoteManifest && Array.isArray(remoteManifest.categories)) {
        setManifest(remoteManifest);
        const loadedBanks = { ...EMBEDDED_BANKS };
        let count = 0;
        for (const cat of remoteManifest.categories) {
          try {
            const bRes = await window.fetch(cat.file, { cache: 'no-store' });
            if (bRes.ok) {
              loadedBanks[cat.id] = await bRes.json();
              count++;
            }
          } catch {
            // 保留內建備援
          }
        }
        setBanks(loadedBanks);
        setLoadStatus({
          mode: 'external',
          loadedFiles: count,
          lastSync: `已從同目錄動態載入 ${count} 個外部題庫檔`
        });
      }
    } catch {
      setLoadStatus({
        mode: 'embedded_ready',
        loadedFiles: Object.keys(banks).length,
        lastSync: '同目錄題庫架構已啟用（可隨時掛載外部 .json/.txt 題庫）'
      });
    }
  }, []);

  useEffect(() => {
    probeSameDirectoryFiles();
  }, [probeSameDirectoryFiles]);

  // 取得目前啟用的題庫與課程物件
  const currentCategory = useMemo(() => {
    return banks[selectedCatId] || Object.values(banks)[0];
  }, [banks, selectedCatId]);

  const currentLesson = useMemo(() => {
    if (!currentCategory || !currentCategory.lessons) return null;
    return currentCategory.lessons.find((l) => l.id === selectedLessonId) || currentCategory.lessons[0];
  }, [currentCategory, selectedLessonId]);

  // 當切換主分類時，自動選取該分類的第一個子課程
  const handleSelectCategory = (catId) => {
    setSelectedCatId(catId);
    const targetBank = banks[catId];
    if (targetBank && targetBank.lessons && targetBank.lessons.length > 0) {
      setSelectedLessonId(targetBank.lessons[0].id);
    }
  };

  // 記錄成績並同步至方案 C 教師收集器佇列
  const recordSessionScore = useCallback((record) => {
    soundEngine.playFanfare();
    const newEntry = {
      id: `rec-${Date.now()}`,
      timestamp: new Date().toLocaleTimeString('zh-TW', { hour12: false }),
      student: `${studentProfile.classId}-${studentProfile.seatNo} ${studentProfile.name}`,
      synced: connectionMode === 'teacher_sync',
      ...record
    };
    setScoreHistory((prev) => {
      const updated = [newEntry, ...prev];
      try {
        localStorage.setItem('cybertype_scores_v2', JSON.stringify(updated));
      } catch {
        // ignore storage error
      }
      return updated;
    });
  }, [studentProfile, connectionMode]);

  // 處理使用者從本機同目錄選取或上傳 .json / .txt 題庫檔熱掛載
  const handleHotMountFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;

    const updatedBanks = { ...banks };
    const updatedCategories = [...manifest.categories];
    let importedCount = 0;

    for (const file of files) {
      try {
        const text = await file.text();
        if (file.name === 'manifest.json') {
          const parsedManifest = JSON.parse(text);
          if (parsedManifest.categories) {
            setManifest(parsedManifest);
          }
          continue;
        }
        if (file.name.endsWith('.json')) {
          const data = JSON.parse(text);
          if (data.categoryId && Array.isArray(data.lessons)) {
            updatedBanks[data.categoryId] = data;
            if (!updatedCategories.some((c) => c.id === data.categoryId)) {
              updatedCategories.push({
                id: data.categoryId,
                title: data.categoryTitle || file.name.replace('.json', ''),
                lang: data.lang || 'en',
                type: 'custom',
                file: `./${file.name}`
              });
            }
            importedCount++;
          }
        } else if (file.name.endsWith('.txt')) {
          // 支援純文字題庫自動轉換為可練習的課程
          const rawLines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
          if (rawLines.length > 0) {
            const customCatId = 'custom_mounted';
            const existingCat = updatedBanks[customCatId] || {
              categoryId: customCatId,
              categoryTitle: '自訂【外部掛載題庫】',
              lang: /[\u4e00-\u9fa5]/.test(text) ? 'zh' : 'en',
              lessons: []
            };
            const words = rawLines.join(' ').split(/\s+/).filter(Boolean);
            const chars = Array.from(new Set(rawLines.join('').split('')));
            const lessonCode = `EXT-${existingCat.lessons.length + 1}`;
            existingCat.lessons.push({
              id: lessonCode,
              code: lessonCode,
              title: `${lessonCode}: ${file.name.replace('.txt', '')}`,
              description: `由同目錄外部文字檔 ${file.name} 動態載入`,
              requiresShiftHint: false,
              keys: chars.slice(0, 40),
              words: words.slice(0, 120),
              lines: rawLines
            });
            updatedBanks[customCatId] = existingCat;
            if (!updatedCategories.some((c) => c.id === customCatId)) {
              updatedCategories.push({
                id: customCatId,
                title: '自訂【外部掛載題庫】',
                lang: existingCat.lang,
                type: 'custom',
                file: `./${file.name}`
              });
            }
            importedCount++;
          }
        }
      } catch {
        // ignore invalid file
      }
    }

    if (importedCount > 0) {
      setBanks(updatedBanks);
      setManifest((prev) => ({ ...prev, categories: updatedCategories }));
      setLoadStatus({
        mode: 'hot_mounted',
        loadedFiles: Object.keys(updatedBanks).length,
        lastSync: `成功熱掛載 ${importedCount} 個外部題庫檔！`
      });
    }
  };

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-950">
      {/* 頂部全域電競狀態導覽列 */}
      <header className="bg-slate-900/90 border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-30 backdrop-blur-md">
        <div className="flex items-center gap-3">
          <button
            onClick={() => setScreen('hub')}
            className="flex items-center gap-2.5 group text-left"
          >
            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-slate-950 font-black shadow-[0_0_15px_rgba(34,211,238,0.4)] group-hover:scale-105 transition">
              <Keyboard className="w-5 h-5" />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <span className="font-extrabold tracking-tight text-base text-white">校園打字專家</span>
                <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                  CyberType v2.0
                </span>
              </div>
              <p className="text-[11px] text-slate-400 hidden sm:block">
                {currentCategory?.categoryTitle} ▸ {currentLesson?.title}
              </p>
            </div>
          </button>
        </div>

        {/* 右側狀態與快速控制按鈕 */}
        <div className="flex items-center gap-2">
          {/* 同目錄題庫管理按鈕 */}
          <button
            onClick={() => setShowBankModal(true)}
            className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold flex items-center gap-1.5 text-cyan-300 transition"
          >
            <Database className="w-3.5 h-3.5" />
            <span>同目錄題庫中心 ({Object.keys(banks).length})</span>
          </button>

          {/* 方案 C 預留：師生連線與成績收集中心 */}
          <button
            onClick={() => setShowTeacherPanel(true)}
            className={`px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition ${
              connectionMode === 'teacher_sync'
                ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300'
                : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-300'
            }`}
          >
            {connectionMode === 'teacher_sync' ? (
              <Wifi className="w-3.5 h-3.5 text-emerald-400 animate-pulse" />
            ) : (
              <WifiOff className="w-3.5 h-3.5 text-slate-400" />
            )}
            <span>{connectionMode === 'teacher_sync' ? `已連線 (${studentProfile.roomCode})` : '單機練習模式'}</span>
          </button>

          {/* 音效切換 */}
          <button
            onClick={toggleMute}
            className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition"
            title={muted ? '開啟電競音效' : '靜音'}
          >
            {muted ? <VolumeX className="w-4 h-4 text-rose-400" /> : <Volume2 className="w-4 h-4 text-cyan-400" />}
          </button>

          {screen !== 'hub' && screen !== 'splash' && (
            <button
              onClick={() => setScreen('hub')}
              className="px-3 py-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 text-xs font-bold transition"
            >
              返回大廳
            </button>
          )}
        </div>
      </header>

      {/* 主內容視圖路由 */}
      <main className="flex-1 flex flex-col max-w-6xl w-full mx-auto p-3 sm:p-5">
        {screen === 'splash' && (
          <SplashView
            connectionMode={connectionMode}
            setConnectionMode={setConnectionMode}
            studentProfile={studentProfile}
            setStudentProfile={setStudentProfile}
            onEnterHub={() => {
              soundEngine.playFanfare();
              setScreen('hub');
            }}
          />
        )}

        {screen === 'hub' && (
          <TacticalHubView
            manifest={manifest}
            banks={banks}
            selectedCatId={selectedCatId}
            onSelectCategory={handleSelectCategory}
            selectedLessonId={selectedLessonId}
            onSelectLesson={setSelectedLessonId}
            currentCategory={currentCategory}
            currentLesson={currentLesson}
            onStartMode={(mode) => {
              soundEngine.playClick();
              setScreen(mode);
            }}
            onOpenBankModal={() => setShowBankModal(true)}
            scoreHistory={scoreHistory}
          />
        )}

        {screen === 'key_drill' && currentLesson && (
          <KeyboardDrillModule
            category={currentCategory}
            lesson={currentLesson}
            onBack={() => setScreen('hub')}
            onSaveScore={recordSessionScore}
          />
        )}

        {screen === 'word_drill' && currentLesson && (
          <WordDrillModule
            category={currentCategory}
            lesson={currentLesson}
            onBack={() => setScreen('hub')}
            onSaveScore={recordSessionScore}
          />
        )}

        {screen === 'space_game' && currentLesson && (
          <SpaceDefenseGameModule
            category={currentCategory}
            lesson={currentLesson}
            onBack={() => setScreen('hub')}
            onSaveScore={recordSessionScore}
          />
        )}

        {screen === 'timed_exam' && currentLesson && (
          <TimedExamModule
            category={currentCategory}
            lesson={currentLesson}
            studentProfile={studentProfile}
            setStudentProfile={setStudentProfile}
            connectionMode={connectionMode}
            onBack={() => setScreen('hub')}
            onSaveScore={recordSessionScore}
          />
        )}
      </main>

      {/* 彈窗 1：同目錄外部題庫動態載入與擴充中心 */}
      {showBankModal && (
        <QuestionBankModal
          manifest={manifest}
          banks={banks}
          loadStatus={loadStatus}
          onClose={() => setShowBankModal(false)}
          onHotMountFiles={handleHotMountFiles}
          onAddCustomLesson={(catId, newLesson) => {
            setBanks((prev) => {
              const target = prev[catId];
              if (!target) return prev;
              return {
                ...prev,
                [catId]: {
                  ...target,
                  lessons: [...target.lessons, newLesson]
                }
              };
            });
          }}
        />
      )}

      {/* 彈窗 2：方案 C 預留 — 教師連線設定與成績收集器面板 */}
      {showTeacherPanel && (
        <TeacherSyncModal
          connectionMode={connectionMode}
          setConnectionMode={setConnectionMode}
          studentProfile={studentProfile}
          setStudentProfile={setStudentProfile}
          scoreHistory={scoreHistory}
          banks={banks}
          onDispatchLesson={(catId, lessonId) => {
            setSelectedCatId(catId);
            setSelectedLessonId(lessonId);
            setShowTeacherPanel(false);
          }}
          onClose={() => setShowTeacherPanel(false)}
        />
      )}
    </div>
  );
}

// ============================================================================
// 9. 模組一：鍵盤遊戲 (單鍵指法訓練 — 還原影片 00:21 ~ 01:42)
//    - 支援「練習」與「挑戰」切換、5/10/15/20 分鐘設定
//    - 支援 Q-6 彈出 Shift / CapsLock 大小寫與符號說明視窗 (影片 01:09)
//    - 支援連打防呆提示：「打字中…不能改！」、「已經開始囉」(影片 00:48)
//    - 結算彈窗顯示：答對題數、答錯題數、每分鐘鍵數 (KPM)、錯誤率 (%)、計時
// ============================================================================
function KeyboardDrillModule({ category, lesson, onBack, onSaveScore }) {
  const [subMode, setSubMode] = useState('practice'); // 'practice' (練習) | 'challenge' (挑戰)
  const [durationMin, setDurationMin] = useState(5);
  const [status, setStatus] = useState('idle'); // 'idle' | 'running' | 'finished'
  const [timeLeft, setTimeLeft] = useState(5 * 60);
  const [elapsedSec, setElapsedSec] = useState(0);

  // 題目狀態
  const keyPool = useMemo(() => {
    const raw = lesson.keys && lesson.keys.length > 0 ? lesson.keys : 'asdfjkl; '.split('');
    return raw;
  }, [lesson]);

  const [qIndex, setQIndex] = useState(0);
  const [targetChar, setTargetChar] = useState(keyPool[0] || 'a');
  const [correctCount, setCorrectCount] = useState(0);
  const [wrongCount, setWrongCount] = useState(0);
  const [feedbackStatus, setFeedbackStatus] = useState(null); // 'correct' | 'wrong'
  const [lastWrongKey, setLastWrongKey] = useState(null);
  const [bannerNotice, setBannerNotice] = useState('按【空白鍵】或【Enter】鍵開始');
  const [showShiftGuide, setShowShiftGuide] = useState(() => Boolean(lesson.requiresShiftHint));

  // 計時器
  useEffect(() => {
    if (status !== 'running') return;
    const timer = setInterval(() => {
      setElapsedSec((s) => s + 1);
      setTimeLeft((prev) => {
        if (prev <= 1) {
          clearInterval(timer);
          setStatus('finished');
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [status]);

  // 啟動或重置練習
  const startDrill = useCallback(() => {
    soundEngine.playClick();
    setStatus('running');
    setTimeLeft(durationMin * 60);
    setElapsedSec(0);
    setCorrectCount(0);
    setWrongCount(0);
    setQIndex(0);
    setTargetChar(keyPool[0] || 'a');
    setFeedbackStatus(null);
    setBannerNotice('開始挑戰囉！');
  }, [durationMin, keyPool]);

  const finishDrill = useCallback(() => {
    if (status !== 'running') return;
    setStatus('finished');
    const usedSec = Math.max(1, elapsedSec);
    const kpm = Math.round((correctCount / usedSec) * 60);
    const total = correctCount + wrongCount;
    const errRate = total > 0 ? Math.round((wrongCount / total) * 100) : 0;
    onSaveScore({
      mode: '鍵盤遊戲',
      lesson: `${lesson.code}${subMode === 'practice' ? 's' : 'r'}`,
      speed: `${kpm} 鍵/分`,
      errorRate: `${errRate}%`,
      score: Math.max(0, correctCount * 10 - wrongCount * 15)
    });
  }, [status, elapsedSec, correctCount, wrongCount, lesson.code, subMode, onSaveScore]);

  // 攔截鍵盤事件 (支援英打、大小寫與中打注音實體鍵位直擊)
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (showShiftGuide) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          setShowShiftGuide(false);
        }
        return;
      }

      // 忽略純修飾鍵本身
      if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) {
        return;
      }

      if (status === 'idle') {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          startDrill();
        }
        return;
      }

      if (status !== 'running') return;
      e.preventDefault();

      // 判斷學生按下的字元 (若是中打注音模式，可由實體按鍵 e.code 直接映射注音符號，免切換輸入法！)
      let pressedChar = e.key;
      if (category.lang === 'zh-bopomofo') {
        if (e.code === 'Space') {
          pressedChar = ' ';
        } else if (CODE_TO_ZH_MAP[e.code]) {
          pressedChar = CODE_TO_ZH_MAP[e.code];
        }
      }

      if (pressedChar === targetChar) {
        soundEngine.playHit(1);
        const nextCorrect = correctCount + 1;
        setCorrectCount(nextCorrect);
        setFeedbackStatus('correct');
        setLastWrongKey(null);
        setBannerNotice(`答對 ${nextCorrect} 題${wrongCount > 0 ? `  錯 ${wrongCount} 題` : ''}`);

        // 推進下一題
        const nextIdx = (qIndex + 1) % keyPool.length;
        setQIndex(nextIdx);
        setTargetChar(keyPool[nextIdx]);
      } else {
        soundEngine.playError();
        const nextWrong = wrongCount + 1;
        setWrongCount(nextWrong);
        setFeedbackStatus('wrong');
        setLastWrongKey(pressedChar);
        setBannerNotice(`答對 ${correctCount} 題  錯 ${nextWrong} 題`);
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [status, showShiftGuide, category.lang, targetChar, correctCount, wrongCount, qIndex, keyPool, startDrill]);

  // 點擊上方設定按鈕時的防呆提示 (還原影片 00:48「打字中…不能改！」)
  const handleLockedSettingClick = (actionFn) => {
    if (status === 'running') {
      soundEngine.playError();
      setBannerNotice('打字中…不能改！');
      return;
    }
    actionFn();
  };

  const usedSec = Math.max(1, elapsedSec);
  const kpm = Math.round((correctCount / usedSec) * 60);
  const totalAttempts = correctCount + wrongCount;
  const errorRate = totalAttempts > 0 ? Math.round((wrongCount / totalAttempts) * 100) : 0;

  return (
    <div className="space-y-4">
      {/* 頂部功能控制列 (完全對應影片 00:21 頂部按鈕列：字根、練習、挑戰、時間、進度、結束、離開) */}
      <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-2">
          <button
            onClick={() => handleLockedSettingClick(() => setSubMode('practice'))}
            className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${
              subMode === 'practice'
                ? 'bg-cyan-500 text-slate-950 border-cyan-300 shadow-[0_0_15px_rgba(34,211,238,0.4)]'
                : 'bg-slate-800 text-slate-300 border-slate-700'
            }`}
          >
            <span>1. 練習 (標準指法提示)</span>
          </button>

          <button
            onClick={() => handleLockedSettingClick(() => setSubMode('challenge'))}
            className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${
              subMode === 'challenge'
                ? 'bg-amber-400 text-slate-950 border-amber-300 shadow-[0_0_15px_rgba(251,191,36,0.4)]'
                : 'bg-slate-800 text-slate-300 border-slate-700'
            }`}
          >
            <span>2. 挑戰 (隨機抽考模式)</span>
          </button>

          <button
            onClick={() =>
              handleLockedSettingClick(() => {
                const nextMin = durationMin === 5 ? 10 : durationMin === 10 ? 15 : durationMin === 15 ? 20 : 5;
                setDurationMin(nextMin);
                setTimeLeft(nextMin * 60);
              })
            }
            className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 transition"
          >
            3. 時間 ({durationMin} 分鐘)
          </button>

          {lesson.requiresShiftHint && (
            <button
              onClick={() => setShowShiftGuide(true)}
              className="px-3 py-2 rounded-xl bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-bold"
            >
              Shift 大小寫說明
            </button>
          )}
        </div>

        <div className="flex items-center gap-2">
          {/* 倒數計時器 */}
          <div className="px-3.5 py-1.5 rounded-xl bg-slate-950 border border-amber-500/40 font-mono text-base font-black text-amber-300 flex items-center gap-2">
            <Timer className="w-4 h-4 text-amber-400" />
            <span>
              {String(Math.floor(timeLeft / 60)).padStart(2, '0')} : {String(timeLeft % 60).padStart(2, '0')}
            </span>
          </div>

          {status === 'running' ? (
            <button
              onClick={finishDrill}
              className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs transition"
            >
              結束結算 (E)
            </button>
          ) : (
            <button
              onClick={startDrill}
              className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs transition"
            >
              開始挑戰 (Space)
            </button>
          )}

          <button
            onClick={onBack}
            className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-xs transition"
          >
            離開 (X)
          </button>
        </div>
      </div>

      {/* 中央目標字卡顯示區 + 狀態橫幅 + 雙手十指指示圖 */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
        {/* 左側目標字根星空黑板 */}
        <div className="lg:col-span-8 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-cyan-400 uppercase tracking-wider">
              {lesson.title}
            </span>
            <span className="px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 font-extrabold text-sm">
              {bannerNotice}
            </span>
          </div>

          <div className="my-4 flex items-center justify-center gap-6">
            {/* 大型藍色星空目標字卡 (還原影片中央藍底黃字顯示框) */}
            <div className="w-56 h-32 rounded-2xl bg-gradient-to-br from-blue-950 via-indigo-950 to-slate-950 border-2 border-cyan-400/60 shadow-[0_0_30px_rgba(34,211,238,0.2)] flex flex-col items-center justify-center relative">
              {status === 'idle' ? (
                <div className="text-center">
                  <div className="text-2xl font-black text-amber-300 tracking-wide">⊙_⊙y</div>
                  <div className="text-xs text-cyan-300 mt-1 font-bold">按【空白鍵】開始</div>
                </div>
              ) : (
                <>
                  <span className="text-5xl sm:text-6xl font-mono font-black text-amber-300 drop-shadow-[0_0_12px_rgba(251,191,36,0.5)]">
                    {targetChar === ' ' ? '空白' : targetChar}
                  </span>
                  {category.lang === 'zh-bopomofo' && CHAR_TO_KEY_MAP[targetChar] && (
                    <span className="text-[11px] font-mono text-cyan-300 mt-1">
                      對應英數鍵: [{CHAR_TO_KEY_MAP[targetChar].main}]
                    </span>
                  )}
                </>
              )}
            </div>

            {/* 即時統計資訊卡 */}
            <div className="grid grid-cols-2 gap-2.5 flex-1 max-w-xs">
              <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3">
                <div className="text-[11px] text-slate-400">答對題數</div>
                <div className="text-xl font-black font-mono text-emerald-400">{correctCount} 題</div>
              </div>
              <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3">
                <div className="text-[11px] text-slate-400">答錯題數</div>
                <div className="text-xl font-black font-mono text-rose-400">{wrongCount} 題</div>
              </div>
              <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3">
                <div className="text-[11px] text-slate-400">每分鐘鍵數</div>
                <div className="text-lg font-black font-mono text-cyan-300">{status === 'running' ? kpm : 0} 鍵/分</div>
              </div>
              <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3">
                <div className="text-[11px] text-slate-400">目前錯誤率</div>
                <div className="text-lg font-black font-mono text-amber-300">{errorRate}%</div>
              </div>
            </div>
          </div>

          <div className="text-xs text-slate-400 flex items-center justify-between border-t border-slate-800/80 pt-2.5">
            <span>提示：請將左手食指輕放於 F 鍵、右手食指輕放於 J 鍵定位凸點上</span>
            <span className="font-mono text-cyan-300">進度：{qIndex + 1} / {keyPool.length}</span>
          </div>
        </div>

        {/* 右側雙手十指動態光點指示器 */}
        <div className="lg:col-span-4">
          <CyberHandsIndicator
            targetChar={status === 'running' ? targetChar : null}
            feedbackStatus={feedbackStatus}
          />
        </div>
      </div>

      {/* 下方彩色人體工學虛擬鍵盤 */}
      <CyberVirtualKeyboard
        targetChar={status === 'running' ? targetChar : null}
        lang={category.lang}
        lastWrongKey={lastWrongKey}
      />

      {/* Q-6 專屬：大小寫與符號輸入方式提示視窗 (100% 還原影片 01:09 彈窗) */}
      {showShiftGuide && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-slate-900 border-2 border-cyan-400 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center gap-2.5 text-cyan-300 font-black text-lg">
              <Info className="w-6 h-6" />
              <span>【大、小寫及符號】輸入法說明</span>
            </div>
            <div className="space-y-3 text-sm text-slate-200 leading-relaxed bg-slate-950 p-4 rounded-xl border border-slate-800">
              <p>本課含【大、小寫及符號】兩種切換方式：</p>
              <p className="text-amber-300 font-semibold">
                1. 出現全大寫或大小寫切換時，可按左方【CapsLock】鍵切換，或搭配左右【Shift】複合鍵。
              </p>
              <p className="text-cyan-300 font-semibold">
                2. 大寫字母「A B C...」或上排符號「! @ # $ %...」，請用另一手小指按住【Shift】複合鍵不放，再按目標鍵！
              </p>
            </div>
            <div className="flex justify-end">
              <button
                onClick={() => setShowShiftGuide(false)}
                className="px-6 py-2.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black text-sm"
              >
                確定 (Enter)
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 結算成績單彈窗 (還原影片 00:59 與 01:41 結算畫面) */}
      {status === 'finished' && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-slate-900 border-2 border-emerald-400 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 text-center">
            <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-400 text-emerald-300 flex items-center justify-center mx-auto">
              <Award className="w-7 h-7" />
            </div>
            <div>
              <h3 className="text-xl font-black text-white">鍵盤練習結算報告</h3>
              <p className="text-xs text-slate-400 mt-1">{lesson.title}</p>
            </div>

            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2.5 text-left font-mono text-sm">
              <div className="flex justify-between">
                <span className="text-slate-400">課程代號：</span>
                <span className="text-cyan-300 font-bold">{lesson.code}{subMode === 'practice' ? 's' : 'r'}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">答對題數：</span>
                <span className="text-emerald-400 font-bold">{correctCount} 題</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">答錯題數：</span>
                <span className="text-rose-400 font-bold">{wrongCount} 題</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">打字速度：</span>
                <span className="text-amber-300 font-bold">每分鐘 {kpm} 鍵</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">錯誤率：</span>
                <span className="text-rose-300 font-bold">{errorRate}%</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">總計時：</span>
                <span className="text-slate-200 font-bold">
                  {Math.floor(elapsedSec / 60)} 分 {elapsedSec % 60} 秒
                </span>
              </div>
            </div>

            <div className="flex gap-3 justify-center">
              <button
                onClick={startDrill}
                className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm"
              >
                再玩一次
              </button>
              <button
                onClick={() => setStatus('idle')}
                className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm"
              >
                返回練習畫面
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// 10. 模組二：字例練習 (字串與詞彙連貫訓練 — 還原影片 01:51 ~ 02:12)
//     - 顯示目標字串（如 abcd, efg, hij, klmn 或單字）
//     - 每輸入一個正確字元，下方虛擬鍵盤自動預判並高亮「下一個字元」對應的按鍵與手指
//     - 打完字串後按空白鍵或自動完成該題
// ============================================================================
function WordDrillModule({ category, lesson, onBack, onSaveScore }) {
  const [durationMin, setDurationMin] = useState(15);
  const [status, setStatus] = useState('idle'); // 'idle' | 'running' | 'finished'
  const [timeLeft, setTimeLeft] = useState(15 * 60);
  const [elapsedSec, setElapsedSec] = useState(0);

  const wordPool = useMemo(() => {
    return lesson.words && lesson.words.length > 0
      ? lesson.words
      : ['abcd', 'efg', 'hij', 'klmn', 'opq', 'rstuv', 'wxyz'];
  }, [lesson]);

  const [wordIdx, setWordIdx] = useState(0);
  const [typedText, setTypedText] = useState('');
  const [correctWords, setCorrectWords] = useState(0);
  const [wrongWords, setWrongWords] = useState(0);
  const [totalCharsTyped, setTotalCharsTyped] = useState(0);
  const [feedbackStatus, setFeedbackStatus] = useState(null);
  const inputRef = useRef(null);

  const currentWord = wordPool[wordIdx] || 'abcd';
  // 計算下一個應按的目標字元，供虛擬鍵盤與雙手圖即時高亮
  const nextTargetChar = useMemo(() => {
    if (status !== 'running') return null;
    if (typedText.length < currentWord.length) {
      return currentWord[typedText.length];
    }
    return ' '; // 打完單字提示按空白鍵或 Enter 送出
  }, [status, typedText, currentWord]);

  useEffect(() => {
    if (status !== 'running') return;
    const timer = setInterval(() => {
      setElapsedSec((s) => s + 1);
      setTimeLeft((prev) => {
        if (prev <= 1) {
          clearInterval(timer);
          setStatus('finished');
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [status]);

  const startPractice = () => {
    soundEngine.playClick();
    setStatus('running');
    setTimeLeft(durationMin * 60);
    setElapsedSec(0);
    setWordIdx(0);
    setTypedText('');
    setCorrectWords(0);
    setWrongWords(0);
    setTotalCharsTyped(0);
    setFeedbackStatus(null);
    setTimeout(() => inputRef.current?.focus(), 50);
  };

  const finishPractice = () => {
    if (status !== 'running') return;
    setStatus('finished');
    const usedSec = Math.max(1, elapsedSec);
    const wpm = Math.round((totalCharsTyped / usedSec) * 60);
    const total = correctWords + wrongWords;
    const errRate = total > 0 ? Math.round((wrongWords / total) * 100) : 0;
    onSaveScore({
      mode: '字例練習',
      lesson: `${lesson.code}w`,
      speed: `${wpm} 字/分`,
      errorRate: `${errRate}%`,
      score: Math.max(0, correctWords * 20 - wrongWords * 10)
    });
  };

  const submitCurrentWord = (val) => {
    const cleanVal = val.trim();
    if (!cleanVal) return;
    if (cleanVal === currentWord) {
      soundEngine.playHit(2);
      setCorrectWords((c) => c + 1);
      setTotalCharsTyped((c) => c + currentWord.length);
      setFeedbackStatus('correct');
    } else {
      soundEngine.playError();
      setWrongWords((w) => w + 1);
      setFeedbackStatus('wrong');
    }
    setTypedText('');
    setWordIdx((idx) => (idx + 1) % wordPool.length);
  };

  const handleInputChange = (e) => {
    const val = e.target.value;
    soundEngine.playClick();
    // 若使用者在尾端按下空白鍵，送出該字例
    if (val.endsWith(' ')) {
      submitCurrentWord(val);
      return;
    }
    setTypedText(val);
    // 若剛好完全符合目標字例，也可自動判定通過（完全還原影片 02:02 打完 abcd 直接跳下一題 efg 的流暢體驗）
    if (val === currentWord) {
      soundEngine.playHit(2);
      setCorrectWords((c) => c + 1);
      setTotalCharsTyped((c) => c + currentWord.length);
      setFeedbackStatus('correct');
      setTimeout(() => {
        setTypedText('');
        setWordIdx((idx) => (idx + 1) % wordPool.length);
      }, 120);
    }
  };

  const usedSec = Math.max(1, elapsedSec);
  const cpm = Math.round((totalCharsTyped / usedSec) * 60);
  const totalAttempts = correctWords + wrongWords;
  const errorRate = totalAttempts > 0 ? Math.round((wrongWords / totalAttempts) * 100) : 0;

  return (
    <div className="space-y-4">
      {/* 頂部控制列 */}
      <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2">
          <span className="px-3 py-1.5 rounded-xl bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-extrabold">
            字例練習 • {lesson.title}
          </span>
          <button
            onClick={() => {
              if (status === 'running') return;
              const nextMin = durationMin === 5 ? 10 : durationMin === 10 ? 15 : 5;
              setDurationMin(nextMin);
              setTimeLeft(nextMin * 60);
            }}
            className="px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300"
          >
            時間設定：{durationMin} 分鐘
          </button>
        </div>

        <div className="flex items-center gap-2">
          <div className="px-3.5 py-1.5 rounded-xl bg-slate-950 border border-amber-500/40 font-mono text-base font-black text-amber-300">
            {String(Math.floor(timeLeft / 60)).padStart(2, '0')} : {String(timeLeft % 60).padStart(2, '0')}
          </div>

          {status === 'running' ? (
            <button
              onClick={finishPractice}
              className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs"
            >
              結束結算
            </button>
          ) : (
            <button
              onClick={startPractice}
              className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs"
            >
              按此開始挑戰
            </button>
          )}

          <button
            onClick={onBack}
            className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
          >
            離開
          </button>
        </div>
      </div>

      {/* 中央字例黑板與輸入區 */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
        <div className="lg:col-span-8 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-400">
              範例字詞連打（逐字對應下方發光鍵位）
            </span>
            <span className="text-sm font-extrabold text-amber-300">
              {status === 'idle' ? '請點選【開始挑戰】啟動' : `答對 ${correctWords} 題  (錯 ${wrongWords} 題)`}
            </span>
          </div>

          <div className="my-5 flex flex-col sm:flex-row items-center justify-center gap-4">
            {/* 左側星空目標字串框 (還原影片 02:00 藍底黃字 abcd) */}
            <div className="w-full sm:w-64 h-28 rounded-2xl bg-gradient-to-br from-blue-950 via-indigo-950 to-slate-950 border-2 border-purple-400/60 flex items-center justify-center px-4 shadow-lg">
              {status === 'idle' ? (
                <span className="text-2xl font-black text-amber-300">字例練習</span>
              ) : (
                <div className="text-3xl sm:text-4xl font-mono font-black tracking-wider flex">
                  {Array.from(currentWord).map((ch, idx) => {
                    const typedChar = typedText[idx];
                    const isMatched = typedChar === ch;
                    const isWrong = typedChar !== undefined && typedChar !== ch;
                    return (
                      <span
                        key={idx}
                        className={
                          isMatched
                            ? 'text-emerald-400'
                            : isWrong
                            ? 'text-rose-400 underline'
                            : 'text-amber-300'
                        }
                      >
                        {ch}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>

            {/* 右側學生輸入白底/深色高對比框 */}
            <div className="w-full sm:flex-1">
              <input
                ref={inputRef}
                type="text"
                disabled={status !== 'running'}
                value={typedText}
                onChange={handleInputChange}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    submitCurrentWord(typedText);
                  }
                }}
                placeholder={status === 'running' ? `請輸入: ${currentWord}` : '等待開始...'}
                className="w-full h-28 rounded-2xl bg-slate-950 border-2 border-cyan-400/70 px-5 text-3xl sm:text-4xl font-mono font-black text-rose-400 placeholder:text-slate-700 outline-none shadow-inner"
              />
            </div>
          </div>

          <div className="text-xs text-slate-400 flex items-center justify-between border-t border-slate-800 pt-2.5">
            <span>下一個目標按鍵：<strong className="text-cyan-300 font-mono">{nextTargetChar || '無'}</strong></span>
            <span className="font-mono text-emerald-300">目前速度：{cpm} 字/分</span>
          </div>
        </div>

        <div className="lg:col-span-4">
          <CyberHandsIndicator targetChar={nextTargetChar} feedbackStatus={feedbackStatus} />
        </div>
      </div>

      <CyberVirtualKeyboard targetChar={nextTargetChar} lang={category.lang} />

      {/* 字例練習結算彈窗 (還原影片 02:11 Q-5w 結算視窗) */}
      {status === 'finished' && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-slate-900 border-2 border-purple-400 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 text-center">
            <h3 className="text-xl font-black text-white">字例練習成績結算</h3>
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2.5 text-left font-mono text-sm">
              <div className="flex justify-between">
                <span className="text-slate-400">課程代號：</span>
                <span className="text-purple-300 font-bold">{lesson.code}w</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">答對題數：</span>
                <span className="text-emerald-400 font-bold">{correctWords} 題</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">答錯題數：</span>
                <span className="text-rose-400 font-bold">{wrongWords} 題</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">每分鐘字數：</span>
                <span className="text-amber-300 font-bold">每分鐘 {cpm} 字</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">錯誤率：</span>
                <span className="text-rose-300 font-bold">{errorRate}%</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">計時：</span>
                <span className="text-slate-200 font-bold">{Math.floor(elapsedSec / 60)} 分 {elapsedSec % 60} 秒</span>
              </div>
            </div>
            <div className="flex gap-3">
              <button
                onClick={startPractice}
                className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm"
              >
                再玩一次
              </button>
              <button
                onClick={() => setStatus('idle')}
                className="flex-1 py-2.5 rounded-xl bg-purple-500 hover:bg-purple-400 text-slate-950 font-black text-sm"
              >
                返回
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// 11. 模組三：打字遊戲 (星空防衛戰 — 還原影片 02:18 ~ 03:32)
//     - 支援 2 種遊戲模式：
//       (A) 【字根/單鍵模式】：畫面上方掉落單一字母/注音，直接按鍵立即雷射擊落（快慢擊落得 18~21 分，漏接倒扣 12 分）
//       (B) 【單字模式】：畫面上方掉落完整單字（如 apple, angel, boy），在下方輸入框打完按【空白鍵】射擊（對得 20~60 分，打錯倒扣 20~40 分）
//     - 支援 5 段速度切換（烏龜 1、小鳥 2、汽車 3、飛機 4、火箭 5）
//     - HTML5 Canvas 星空背景、俄羅斯城堡天際線剪影與動態粒子爆炸特效
// ============================================================================
function SpaceDefenseGameModule({ category, lesson, onBack, onSaveScore }) {
  const [gameType, setGameType] = useState('char'); // 'char' (單字元直擊) | 'word' (單字空白鍵射擊)
  const [speedLevel, setSpeedLevel] = useState(3); // 1 ~ 5
  const [status, setStatus] = useState('idle'); // 'idle' | 'running' | 'finished'
  const [timeLeft, setTimeLeft] = useState(5 * 60);
  const [elapsedSec, setElapsedSec] = useState(0);

  const [score, setScore] = useState(0);
  const [hitCount, setHitCount] = useState(0);
  const [missCount, setMissCount] = useState(0);
  const [typedCharsTotal, setTypedCharsTotal] = useState(0);
  const [statusLog, setStatusLog] = useState('★ 在挑戰模式，按 Enter 或點選【開始挑戰】啟動星空防衛！');
  const [shooterInput, setShooterInput] = useState('');

  const canvasRef = useRef(null);
  const stateRef = useRef({
    fallingItems: [],
    particles: [],
    lasers: [],
    lastSpawn: 0,
    score: 0,
    hitCount: 0,
    missCount: 0,
    typedCharsTotal: 0
  });

  const speedConfigs = [
    { lv: 1, name: 'Lv.1 烏龜慢速', icon: '🐢', vy: 0.45, spawnMs: 1700 },
    { lv: 2, name: 'Lv.2 小鳥常速', icon: '🐦', vy: 0.75, spawnMs: 1400 },
    { lv: 3, name: 'Lv.3 跑車中速', icon: '🚗', vy: 1.1, spawnMs: 1150 },
    { lv: 4, name: 'Lv.4 噴射機高速', icon: '✈️', vy: 1.55, spawnMs: 900 },
    { lv: 5, name: 'Lv.5 火箭極速', icon: '🚀', vy: 2.1, spawnMs: 700 }
  ];

  const currentSpeedCfg = speedConfigs.find((s) => s.lv === speedLevel) || speedConfigs[2];

  // 建立爆炸粒子
  const spawnExplosion = (x, y, color = '#38bdf8') => {
    for (let i = 0; i < 18; i++) {
      const angle = (Math.PI * 2 * i) / 18;
      const spd = 1.5 + Math.random() * 3.5;
      stateRef.current.particles.push({
        x,
        y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        alpha: 1,
        color,
        r: 2 + Math.random() * 2.5
      });
    }
  };

  // 啟動遊戲
  const startGame = useCallback(() => {
    soundEngine.playClick();
    stateRef.current = {
      fallingItems: [],
      particles: [],
      lasers: [],
      lastSpawn: performance.now(),
      score: 0,
      hitCount: 0,
      missCount: 0,
      typedCharsTotal: 0
    };
    setScore(0);
    setHitCount(0);
    setMissCount(0);
    setTypedCharsTotal(0);
    setTimeLeft(5 * 60);
    setElapsedSec(0);
    setShooterInput('');
    setStatusLog(gameType === 'char' ? '★ 看到掉落字元直接按鍵擊落！' : '★ 打完單字按【空白鍵】發射雷射擊落！');
    setStatus('running');
  }, [gameType]);

  // 結束並結算遊戲 (還原影片 03:01 與 03:29 結算視窗)
  const finishGame = useCallback(() => {
    if (status !== 'running') return;
    setStatus('finished');
    const st = stateRef.current;
    const usedSec = Math.max(1, elapsedSec);
    const wpm = Math.round((st.typedCharsTotal / usedSec) * 60);
    const total = st.hitCount + st.missCount;
    const errRate = total > 0 ? Math.round((st.missCount / total) * 100) : 0;
    onSaveScore({
      mode: '打字遊戲',
      lesson: `${lesson.code}g${speedLevel}`,
      speed: `${wpm} 字/分`,
      errorRate: `${errRate}%`,
      score: st.score
    });
  }, [status, elapsedSec, lesson.code, speedLevel, onSaveScore]);

  // 計時器
  useEffect(() => {
    if (status !== 'running') return;
    const timer = setInterval(() => {
      setElapsedSec((s) => s + 1);
      setTimeLeft((prev) => {
        if (prev <= 1) {
          clearInterval(timer);
          finishGame();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [status, finishGame]);

  // Canvas 遊戲主迴圈
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;

    const charPool = (lesson.keys || 'abcdefghijklmnopqrstuvwxyz'.split('')).filter((k) => k !== ' ');
    const wordPool = lesson.words && lesson.words.length > 0 ? lesson.words : ['apple', 'angel', 'boy', 'ball', 'car', 'cake', 'dog', 'duck', 'egg', 'easy'];
    const colors = ['#facc15', '#38bdf8', '#f472b6', '#4ade80', '#c084fc', '#fb923c'];

    const render = (now) => {
      const width = canvas.width;
      const height = canvas.height;
      const groundY = height - 68;

      // 1. 繪製深邃星空漸層背景
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#040d21');
      grad.addColorStop(0.7, '#0c2448');
      grad.addColorStop(1, '#132f5c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // 繪製閃爍星點
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      for (let s = 0; s < 35; s++) {
        const sx = (s * 97) % width;
        const sy = (s * 53) % (groundY - 40);
        ctx.fillRect(sx, sy, 2, 2);
      }

      // 2. 若在運行中，定期生成掉落目標
      if (status === 'running') {
        if (now - stateRef.current.lastSpawn > currentSpeedCfg.spawnMs && stateRef.current.fallingItems.length < 6) {
          const text = gameType === 'char'
            ? charPool[Math.floor(Math.random() * charPool.length)]
            : wordPool[Math.floor(Math.random() * wordPool.length)];
          const padding = 80;
          const x = padding + Math.random() * Math.max(100, width - padding * 2);
          stateRef.current.fallingItems.push({
            id: Math.random(),
            text,
            x,
            y: 28,
            vy: currentSpeedCfg.vy * (0.9 + Math.random() * 0.25),
            color: colors[Math.floor(Math.random() * colors.length)]
          });
          stateRef.current.lastSpawn = now;
        }

        // 更新掉落物位置
        const remaining = [];
        for (const item of stateRef.current.fallingItems) {
          item.y += item.vy;
          if (item.y >= groundY) {
            // 觸地漏接扣分 (還原影片 02:51「★來不及了！倒扣 12 分。」)
            soundEngine.playError();
            stateRef.current.score -= 12;
            stateRef.current.missCount += 1;
            setScore(stateRef.current.score);
            setMissCount(stateRef.current.missCount);
            setStatusLog('★ 來不及了！倒扣 12 分。');
            spawnExplosion(item.x, groundY, '#f43f5e');
          } else {
            remaining.push(item);
          }
        }
        stateRef.current.fallingItems = remaining;
      }

      // 3. 繪製掉落中的字元或單字
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const item of stateRef.current.fallingItems) {
        ctx.font = gameType === 'char' ? '900 28px monospace' : '800 24px monospace';
        ctx.shadowColor = item.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = item.color;
        ctx.fillText(item.text, item.x, item.y);
        ctx.shadowBlur = 0;
      }

      // 4. 繪製雷射光束
      stateRef.current.lasers = stateRef.current.lasers.filter((l) => l.alpha > 0.05);
      for (const l of stateRef.current.lasers) {
        ctx.strokeStyle = `rgba(56, 189, 248, ${l.alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(width / 2, groundY);
        ctx.lineTo(l.tx, l.ty);
        ctx.stroke();
        l.alpha *= 0.82;
      }

      // 5. 繪製爆炸粒子
      stateRef.current.particles = stateRef.current.particles.filter((p) => p.alpha > 0.04);
      for (const p of stateRef.current.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha *= 0.92;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 6. 繪製底部克里姆林宮洋蔥圓頂奇幻天際線 (致敬原版經典視覺)
      const domeCount = Math.floor(width / 70);
      const domePalette = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#a855f7', '#ec4899'];
      for (let i = 0; i < domeCount; i++) {
        const bx = i * 70 + 10;
        const towerH = 38 + (i % 3) * 12;
        const by = height - towerH;
        const col = domePalette[i % domePalette.length];

        // 塔身
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(bx + 12, by + 16, 32, towerH - 16);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(bx + 24, by + 24, 8, 14);

        // 洋蔥圓頂
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(bx + 28, by + 14, 16, 0, Math.PI * 2);
        ctx.fill();

        // 尖塔
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx + 28, by - 10);
        ctx.lineTo(bx + 28, by);
        ctx.stroke();
      }

      animId = requestAnimationFrame(render);
    };

    animId = requestAnimationFrame(render);
    return () => cancelAnimationFrame(animId);
  }, [status, gameType, currentSpeedCfg, lesson]);

  // 單字元模式：攔截鍵盤直接射擊
  useEffect(() => {
    if (status !== 'running' || gameType !== 'char') return;
    const handleKeyDown = (e) => {
      if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) return;
      if (e.key === 'Enter') return;

      let pressed = e.key;
      if (category.lang === 'zh-bopomofo' && CODE_TO_ZH_MAP[e.code]) {
        pressed = CODE_TO_ZH_MAP[e.code];
      }

      // 尋找畫面中對應且最接近地面的目標
      const items = stateRef.current.fallingItems;
      let matchIdx = -1;
      let maxY = -1;
      items.forEach((it, idx) => {
        if (it.text === pressed && it.y > maxY) {
          maxY = it.y;
          matchIdx = idx;
        }
      });

      if (matchIdx !== -1) {
        const hitItem = items[matchIdx];
        // 根據高度決定得分 (18 ~ 21 分，還原影片 02:40「★快慢擊落，得 18 分 / 21 分」)
        const gain = hitItem.y < 140 ? 21 : 18;
        soundEngine.playLaser();
        stateRef.current.lasers.push({ tx: hitItem.x, ty: hitItem.y, alpha: 1 });
        spawnExplosion(hitItem.x, hitItem.y, hitItem.color);
        items.splice(matchIdx, 1);

        stateRef.current.score += gain;
        stateRef.current.hitCount += 1;
        stateRef.current.typedCharsTotal += 1;
        setScore(stateRef.current.score);
        setHitCount(stateRef.current.hitCount);
        setTypedCharsTotal(stateRef.current.typedCharsTotal);
        setStatusLog(`★ 快慢擊落，得 ${gain} 分。`);
      } else {
        soundEngine.playError();
        stateRef.current.score -= 10;
        stateRef.current.missCount += 1;
        setScore(stateRef.current.score);
        setMissCount(stateRef.current.missCount);
        setStatusLog('★ 打錯了！倒扣 10 分。');
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [status, gameType, category.lang]);

  // 單字模式：輸入框按空白鍵或 Enter 射擊 (還原影片 03:09 ~ 03:28)
  const handleWordShoot = (rawVal) => {
    const word = rawVal.trim();
    if (!word) return;
    const items = stateRef.current.fallingItems;
    const matchIdx = items.findIndex((it) => it.text === word);

    if (matchIdx !== -1) {
      const hitItem = items[matchIdx];
      const gain = Math.max(20, word.length * 10);
      soundEngine.playLaser();
      stateRef.current.lasers.push({ tx: hitItem.x, ty: hitItem.y, alpha: 1 });
      spawnExplosion(hitItem.x, hitItem.y, hitItem.color);
      items.splice(matchIdx, 1);

      stateRef.current.score += gain;
      stateRef.current.hitCount += 1;
      stateRef.current.typedCharsTotal += word.length;
      setScore(stateRef.current.score);
      setHitCount(stateRef.current.hitCount);
      setTypedCharsTotal(stateRef.current.typedCharsTotal);
      setStatusLog(`★ 快慢擊落，得 ${gain} 分。`);
    } else {
      soundEngine.playError();
      const penalty = 20;
      stateRef.current.score -= penalty;
      stateRef.current.missCount += 1;
      setScore(stateRef.current.score);
      setMissCount(stateRef.current.missCount);
      setStatusLog(`★ 打錯了！倒扣 ${penalty} 分。`);
    }
    setShooterInput('');
  };

  const usedSec = Math.max(1, elapsedSec);
  const wpm = Math.round((typedCharsTotal / usedSec) * 60);

  return (
    <div className="space-y-3">
      {/* 頂部選單與動物速度切換列 (還原影片 02:18 單字/字根切換、烏龜/小鳥/汽車/飛機圖示、目前得分看板) */}
      <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-2">
          <button
            onClick={() => {
              if (status === 'running') return;
              setGameType('char');
            }}
            className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border transition ${
              gameType === 'char'
                ? 'bg-cyan-400 text-slate-950 border-cyan-300'
                : 'bg-slate-800 text-slate-300 border-slate-700'
            }`}
          >
            字根直擊模式 (A)
          </button>
          <button
            onClick={() => {
              if (status === 'running') return;
              setGameType('word');
            }}
            className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border transition ${
              gameType === 'word'
                ? 'bg-amber-400 text-slate-950 border-amber-300'
                : 'bg-slate-800 text-slate-300 border-slate-700'
            }`}
          >
            單字射擊模式 (W)
          </button>

          {/* 5 級速度選擇 */}
          <div className="flex items-center bg-slate-950 border border-slate-800 rounded-xl p-1 gap-1">
            {speedConfigs.map((cfg) => (
              <button
                key={cfg.lv}
                onClick={() => setSpeedLevel(cfg.lv)}
                className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                  speedLevel === cfg.lv
                    ? 'bg-cyan-500/30 text-cyan-200 border border-cyan-400/50'
                    : 'text-slate-400 hover:text-white'
                }`}
                title={cfg.name}
              >
                <span>{cfg.icon}</span>
                <span className="hidden md:inline">Lv.{cfg.lv}</span>
              </button>
            ))}
          </div>
        </div>

        {/* 中央即時總分顯示 */}
        <div className="px-4 py-1.5 rounded-xl bg-amber-500/20 border border-amber-400/50 text-amber-300 font-black text-base tracking-wide">
          目前得 {score} 分
        </div>

        <div className="flex items-center gap-2">
          {status === 'running' ? (
            <button
              onClick={finishGame}
              className="px-4 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs"
            >
              結束結算
            </button>
          ) : (
            <button
              onClick={startGame}
              className="px-4 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs"
            >
              開始挑戰
            </button>
          )}
          <button
            onClick={onBack}
            className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
          >
            離開 (X)
          </button>
        </div>
      </div>

      {/* 星空防衛戰 Canvas 主舞台 */}
      <div className="relative rounded-2xl overflow-hidden border-2 border-slate-800 shadow-2xl bg-slate-950">
        <canvas
          ref={canvasRef}
          width={960}
          height={430}
          className="w-full h-[360px] sm:h-[430px] block"
        />

        {status === 'idle' && (
          <div className="absolute inset-0 bg-slate-950/65 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-center">
            <div className="px-6 py-4 rounded-2xl bg-slate-900/95 border-2 border-amber-400 shadow-2xl max-w-md space-y-3">
              <div className="text-amber-300 font-black text-2xl">
                {gameType === 'char' ? '★ 單鍵雷射防衛戰' : '★ 單字空白鍵射擊戰'}
              </div>
              <p className="text-xs text-slate-300 leading-relaxed">
                {gameType === 'char'
                  ? '看到夜空中掉落的字母或注音字根，直接按下鍵盤對應按鍵即可發射雷射擊落！'
                  : '看到夜空中掉落的英文單字，於下方射擊艙輸入完整單字並按【空白鍵】即可擊落！'}
              </p>
              <button
                onClick={startGame}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-base shadow-lg"
              >
                按此開始挑戰 (Enter)
              </button>
            </div>
          </div>
        )}
      </div>

      {/* 底部射擊控制台與狀態訊息列 (還原影片底部：左方黑底黃字得分訊息 + 中央射擊輸入框 + 右方計時器) */}
      <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3">
        <div className="px-4 py-2 rounded-xl bg-slate-950 border border-slate-800 text-amber-300 font-bold text-sm min-w-[240px]">
          {statusLog}
        </div>

        {gameType === 'word' && (
          <div className="flex-1 max-w-sm">
            <input
              type="text"
              disabled={status !== 'running'}
              value={shooterInput}
              onChange={(e) => {
                const v = e.target.value;
                soundEngine.playClick();
                if (v.endsWith(' ')) {
                  handleWordShoot(v);
                } else {
                  setShooterInput(v);
                }
              }}
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  handleWordShoot(shooterInput);
                }
              }}
              placeholder="輸入掉落單字後按【空白鍵】射擊..."
              className="w-full bg-slate-950 border-2 border-cyan-400 rounded-xl px-4 py-2 text-lg font-mono font-bold text-white outline-none"
            />
          </div>
        )}

        <div className="flex items-center gap-3 font-mono text-sm">
          <span className="text-emerald-400 font-bold">擊中: {hitCount}</span>
          <span className="text-rose-400 font-bold">失誤: {missCount}</span>
          <div className="px-3.5 py-1.5 rounded-xl bg-slate-950 border border-amber-500/40 text-amber-300 font-black">
            計時 {String(Math.floor(timeLeft / 60)).padStart(2, '0')} : {String(timeLeft % 60).padStart(2, '0')}
          </div>
        </div>
      </div>

      {/* 打字遊戲結算彈窗 (100% 還原影片 03:01 與 03:29：打對、打錯、每分鐘字數、綜合成績、英打扣分嚴苛請穩紮穩打) */}
      {status === 'finished' && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-slate-900 border-2 border-amber-400 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 text-center">
            <h3 className="text-xl font-black text-white">打字遊戲戰績結算</h3>
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2.5 text-left font-mono text-sm">
              <div className="flex justify-between">
                <span className="text-slate-400">關卡代號：</span>
                <span className="text-cyan-300 font-bold">{lesson.code}g{speedLevel}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">打對：</span>
                <span className="text-emerald-400 font-bold">
                  {gameType === 'char' ? `${hitCount} 題` : `${typedCharsTotal} ch`}
                </span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">打錯：</span>
                <span className="text-rose-400 font-bold">{missCount} 題</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">每分鐘：</span>
                <span className="text-amber-300 font-bold">{wpm} 字</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">計時：</span>
                <span className="text-slate-200 font-bold">{Math.floor(elapsedSec / 60)} 分 {elapsedSec % 60} 秒</span>
              </div>
              <div className="flex justify-between pt-2 border-t border-slate-800">
                <span className="text-slate-300 font-bold">綜合成績：</span>
                <span className="text-amber-400 font-black text-base">得 {score} 分</span>
              </div>
            </div>
            <p className="text-xs font-bold text-cyan-300">
              （英打扣分嚴苛，請穩紮穩打）
            </p>
            <div className="flex gap-3">
              <button
                onClick={startGame}
                className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm"
              >
                再玩一次
              </button>
              <button
                onClick={() => setStatus('idle')}
                className="flex-1 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm"
              >
                返回
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// 12. 模組四：計時測驗 / 逐行看打 (還原影片 03:35 ~ 05:14)
//     - 頂部學生資訊列：題庫、時間 (1~10分)、學號、姓名、班級
//     - 測驗前確認彈窗 (影片 03:49)：提醒打完一行按 Enter 跳下一行、多打/漏打/打錯採智慧評分
//     - 奇偶行對照看打區：支援中打 IME 組字事件 (compositionstart/end)，右上角動態狀態 (`打快點..` / `Orz..` / `加油喔..`)
//     - 成績檢視報告 (影片 04:55 ~ 05:13)：
//       完整呈現 `*` (打錯)、`-` (漏打)、`+` (多打)、`←` (最後位置)、`@@` (顛倒打字)
//       每行統計：`*打對: X  打錯: X  漏打: X  多打: X  得分: X  L:行號`
// ============================================================================
function TimedExamModule({
  category,
  lesson,
  studentProfile,
  setStudentProfile,
  connectionMode,
  onBack,
  onSaveScore
}) {
  const [durationMin, setDurationMin] = useState(3);
  const [status, setStatus] = useState('idle'); // 'idle' | 'confirm_modal' | 'running' | 'report'
  const [timeLeft, setTimeLeft] = useState(3 * 60);
  const [elapsedSec, setElapsedSec] = useState(0);

  const targetLines = useMemo(() => {
    return lesson.lines && lesson.lines.length > 0
      ? lesson.lines
      : [
          'zxcvb za xs cd vf bf nm,./ nj mj ,k .l /; zxcvb nm,./',
          'zoo zero lazy ox fox fix six taxi cd card city clock',
          'very five give love bee bird baby ball nice next neck',
          'man milk moon music a.m. p.m. mr. color candy school',
          'brother mother uncle duck rabbit zebra cowboy family'
        ];
  }, [lesson]);

  const [typedLines, setTypedLines] = useState(() => targetLines.map(() => ''));
  const [activeLineIdx, setActiveLineIdx] = useState(0);
  const [cursorCol, setCursorCol] = useState(1);
  const [isComposing, setIsComposing] = useState(false);
  const [selectedReportLineIdx, setSelectedReportLineIdx] = useState(null);

  const lineInputRefs = useRef([]);

  // 當課程切換時重置行資料
  useEffect(() => {
    setTypedLines(targetLines.map(() => ''));
    setActiveLineIdx(0);
    setCursorCol(1);
  }, [targetLines]);

  // 倒數計時器
  useEffect(() => {
    if (status !== 'running') return;
    const timer = setInterval(() => {
      setElapsedSec((s) => s + 1);
      setTimeLeft((prev) => {
        if (prev <= 1) {
          clearInterval(timer);
          setStatus('report');
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [status]);

  // 正式啟動逐行看打
  const launchExam = () => {
    soundEngine.playClick();
    setTypedLines(targetLines.map(() => ''));
    setActiveLineIdx(0);
    setCursorCol(1);
