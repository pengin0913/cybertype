    setTimeLeft(durationMin * 60);
    setElapsedSec(0);
    setSelectedReportLineIdx(null);
    setStatus('running');
    setTimeout(() => {
      lineInputRefs.current[0]?.focus();
    }, 60);
  };

  // 計算全部行的 LCS 智慧交叉比對報告
  const examReport = useMemo(() => {
    if (status !== 'report') return null;
    // 找出最後一行有輸入內容的行索引
    let lastTypedIdx = 0;
    typedLines.forEach((txt, idx) => {
      if (txt.length > 0) lastTypedIdx = idx;
    });

    const lineResults = targetLines.map((tLine, idx) => {
      const uLine = typedLines[idx] || '';
      const isLast = idx === lastTypedIdx;
      return {
        lineNo: idx + 1,
        ...analyzeSmartLineDiff(tLine, uLine, isLast && idx <= lastTypedIdx)
      };
    });

    let totalCorrect = 0;
    let totalWrong = 0;
    let totalMissing = 0;
    let totalExtra = 0;
    let totalScore = 0;

    lineResults.forEach((r) => {
      if (r.typedText.length > 0) {
        totalCorrect += r.correct;
        totalWrong += r.wrong;
        totalMissing += r.missing;
        totalExtra += r.extra;
        totalScore += r.score;
      }
    });

    const usedSec = Math.max(1, elapsedSec);
    // 原版評分規則：英打以每4個英文字母折算1個字，或直接顯示字元/分鐘與錯誤率
    const cpm = Math.round((totalCorrect / usedSec) * 60);
    const totalMistakes = totalWrong + totalMissing + totalExtra;
    const totalEvaluated = Math.max(1, totalCorrect + totalMistakes);
    const errorRate = Math.round((totalMistakes / totalEvaluated) * 100);

    return {
      lineResults,
      totalCorrect,
      totalWrong,
      totalMissing,
      totalExtra,
      totalMistakes,
      totalScore,
      cpm,
      errorRate,
      usedSec
    };
  }, [status, targetLines, typedLines, elapsedSec]);

  // 完成看打並進入成績報告
  const finishExam = useCallback(() => {
    if (status !== 'running') return;
    setStatus('report');
  }, [status]);

  // 當報告產生時寫入歷史成績
  useEffect(() => {
    if (status === 'report' && examReport) {
      onSaveScore({
        mode: '計時測驗',
        lesson: lesson.code,
        speed: `${examReport.cpm} 字/分`,
        errorRate: `${examReport.errorRate}%`,
        score: examReport.totalScore
      });
    }
  }, [status, examReport, lesson.code, onSaveScore]);

  // 支援 Alt+F12 或 Ctrl+Enter 提前結束看打 (還原影片左下角 `Alt+F12提前結束`)
  useEffect(() => {
    if (status !== 'running') return;
    const handleGlobalKey = (e) => {
      if ((e.altKey && e.key === 'F12') || (e.ctrlKey && e.key === 'Enter')) {
        e.preventDefault();
        finishExam();
      }
    };
    window.addEventListener('keydown', handleGlobalKey);
    return () => window.removeEventListener('keydown', handleGlobalKey);
  }, [status, finishExam]);

  // 右上角動態表情狀態 (還原影片 04:21 `打快點..` -> `Orz..` -> `加油喔..`)
  const moodBanner = useMemo(() => {
    if (status !== 'running') return '計時測驗(T)';
    if (elapsedSec < 12) return '測驗中..';
    if (elapsedSec % 18 < 6) return '打快點..';
    if (elapsedSec % 18 < 12) return 'Orz..';
    return '加油喔..';
  }, [status, elapsedSec]);

  return (
    <div className="space-y-4">
      {/* 頂部學生資訊與控制列 (還原影片 03:35 題庫、時間、學號、姓名、班級、逐行看打按鈕) */}
      <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex items-center gap-1.5">
            <span className="text-xs text-slate-400 font-bold">題庫:</span>
            <span className="px-2.5 py-1 rounded-lg bg-blue-500/20 border border-blue-400/40 text-blue-300 text-xs font-extrabold">
              {lesson.title}
            </span>
          </div>

          <div className="flex items-center gap-1.5">
            <span className="text-xs text-slate-400 font-bold">時間:</span>
            <select
              disabled={status === 'running'}
              value={durationMin}
              onChange={(e) => {
                const m = Number(e.target.value);
                setDurationMin(m);
                setTimeLeft(m * 60);
              }}
              className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs font-bold text-amber-300"
            >
              {[1, 2, 3, 5, 10].map((m) => (
                <option key={m} value={m}>{m} 分</option>
              ))}
            </select>
          </div>

          <div className="flex items-center gap-1.5">
            <span className="text-xs text-slate-400">學號:</span>
            <input
              type="text"
              disabled={status === 'running'}
              value={studentProfile.seatNo}
              onChange={(e) => setStudentProfile({ ...studentProfile, seatNo: e.target.value })}
              className="w-16 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs font-mono text-white"
            />
          </div>

          <div className="flex items-center gap-1.5">
            <span className="text-xs text-slate-400">姓名:</span>
            <input
              type="text"
              disabled={status === 'running'}
              value={studentProfile.name}
              onChange={(e) => setStudentProfile({ ...studentProfile, name: e.target.value })}
              className="w-24 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white"
            />
          </div>

          <div className="flex items-center gap-1.5">
            <span className="text-xs text-slate-400">班級:</span>
            <input
              type="text"
              disabled={status === 'running'}
              value={studentProfile.classId}
              onChange={(e) => setStudentProfile({ ...studentProfile, classId: e.target.value })}
              className="w-16 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs font-mono text-white"
            />
          </div>
        </div>

        <div className="flex items-center gap-2">
          {status === 'running' ? (
            <button
              onClick={finishExam}
              className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-lg"
            >
              {moodBanner} (點此交卷)
            </button>
          ) : (
            <button
              onClick={() => setStatus('confirm_modal')}
              className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 text-slate-950 font-black text-xs shadow-lg"
            >
              逐行看打 (開始測驗)
            </button>
          )}

          <button
            onClick={onBack}
            className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
          >
            離開
          </button>
        </div>
      </div>

      {/* 主看打區域 vs 成績檢視報告 */}
      {status !== 'report' ? (
        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-6 space-y-5 shadow-xl">
          {/* 逐行看打輸入框列表 */}
          <div className="space-y-4 max-h-[440px] overflow-y-auto pr-1">
            {targetLines.map((lineText, idx) => {
              const isCurrent = status === 'running' && activeLineIdx === idx;
              const typed = typedLines[idx] || '';

              return (
                <div
                  key={idx}
                  className={`p-3.5 rounded-xl border transition ${
                    isCurrent
                      ? 'bg-slate-950/95 border-cyan-400 shadow-[0_0_20px_rgba(34,211,238,0.15)]'
                      : 'bg-slate-950/50 border-slate-800/80'
                  }`}
                >
                  {/* 奇數行：原始題目行 (帶即時字元對錯高亮輔助) */}
                  <div className="font-mono text-base sm:text-lg tracking-wide select-none mb-2 flex items-center gap-2">
                    <span className="text-xs px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-bold">
                      {String(idx + 1).padStart(2, '0')}
                    </span>
                    <div className="flex flex-wrap">
                      {Array.from(lineText).map((ch, cIdx) => {
                        const uCh = typed[cIdx];
                        let cls = 'text-emerald-300';
                        if (uCh !== undefined) {
                          cls = uCh === ch ? 'text-cyan-300 font-bold' : 'bg-rose-500/30 text-rose-300 underline';
                        }
                        return (
                          <span key={cIdx} className={cls}>
                            {ch === ' ' ? '\u00A0' : ch}
                          </span>
                        );
                      })}
                    </div>
                  </div>

                  {/* 偶數行：學生看打輸入框 (打完一行按 Enter 跳下一行) */}
                  <div className="flex items-center gap-2">
                    <span className="text-xs px-1.5 py-0.5 text-transparent select-none">00</span>
                    <input
                      ref={(el) => (lineInputRefs.current[idx] = el)}
                      type="text"
                      disabled={status !== 'running'}
                      value={typed}
                      onFocus={() => setActiveLineIdx(idx)}
                      onCompositionStart={() => setIsComposing(true)}
                      onCompositionEnd={() => setIsComposing(false)}
                      onChange={(e) => {
                        soundEngine.playClick();
                        const val = e.target.value;
                        setCursorCol(val.length + 1);
                        setTypedLines((prev) => {
                          const copy = [...prev];
                          copy[idx] = val;
                          return copy;
                        });
                      }}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && !isComposing) {
                          e.preventDefault();
                          if (idx < targetLines.length - 1) {
                            const nextIdx = idx + 1;
                            setActiveLineIdx(nextIdx);
                            setCursorCol((typedLines[nextIdx] || '').length + 1);
                            lineInputRefs.current[nextIdx]?.focus();
                          } else {
                            // 最後一行按 Enter 直接交卷結算 (還原影片 04:53 行為)
                            finishExam();
                          }
                        }
                      }}
                      placeholder={status === 'running' ? '在此逐行輸入，打完本行請按【Enter】跳下一行...' : ''}
                      className="w-full bg-slate-900/90 border border-slate-700 focus:border-cyan-400 rounded-lg px-3 py-1.5 font-mono text-base sm:text-lg text-white outline-none"
                    />
                  </div>
                </div>
              );
            })}
          </div>

          {/* 說明區 (還原影片 03:35 下方規則說明) */}
          {status === 'idle' && (
            <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-4 space-y-2 text-xs sm:text-sm text-slate-300 leading-relaxed">
              <p className="text-cyan-300 font-bold">
                ※ {connectionMode === 'teacher_sync' ? `連線模式：成績將自動回傳至教師收集器 (${studentProfile.roomCode})` : '個人學習：【學號、姓名、班級】內定為本機紀錄，亦可開啟右上角與老師連線。'}
              </p>
              <p>1. 每打完一行，按【Enter】跳下一行；完成最後一行輸入，按【Enter】確認交卷。</p>
              <p>2. 採<strong className="text-amber-300">智慧交叉評分</strong>，可以不用對齊，【多打、漏打或打錯】不會整行連環扣分。</p>
              <p className="text-emerald-300 font-bold">3. 按右上角「逐行看打」開始挑戰！</p>
            </div>
          )}

          {/* 底部狀態列：行號-字元游標位置、提前結束按鈕、計時器 (還原影片 04:00 左下角 `1 - 34` 與右下角計時) */}
          <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800">
            <div className="flex items-center gap-2">
              <div className="px-3 py-1 rounded-lg bg-slate-950 border border-emerald-500/40 font-mono text-xs font-bold text-emerald-300">
                行 {activeLineIdx + 1} - 字 {cursorCol}
              </div>
              {status === 'running' && (
                <button
                  onClick={finishExam}
                  className="px-3 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 text-xs font-bold transition"
                >
                  Alt+F12 提前結束並計算成績
                </button>
              )}
            </div>

            <div className="px-4 py-1.5 rounded-xl bg-amber-500/20 border border-amber-500/40 font-mono text-base font-black text-amber-300">
              計時 {String(Math.floor(timeLeft / 60)).padStart(2, '0')} : {String(timeLeft % 60).padStart(2, '0')}
            </div>
          </div>
        </div>
      ) : (
        /* ====================================================================
           成績檢視報告 (100% 還原影片 04:55 ~ 05:13 智慧交叉比對報告 + 現代彩色視覺化)
           ==================================================================== */
        examReport && (
          <div className="bg-slate-900 border-2 border-cyan-400/70 rounded-2xl p-4 sm:p-6 space-y-5 shadow-2xl">
            {/* 頂部提示說明區 (對應影片 04:56 符號說明) */}
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <Sparkles className="w-4 h-4 text-amber-400" />
                  <span className="font-black text-white text-base">
                    【成績檢視】測驗題庫：{lesson.title}
                  </span>
                </div>
                <p className="text-xs font-mono text-slate-300 leading-relaxed">
                  打錯的字以「<strong className="text-rose-400">*</strong>」表示、
                  漏打的字以「<strong className="text-amber-400">-</strong>」表示、
                  多打的字以「<strong className="text-purple-400">+</strong>」表示、
                  最後一行打的位置以「<strong className="text-cyan-400">← 或 ▽</strong>」表示、
                  顛倒打的字以「<strong className="text-pink-400">@@</strong>」表示
                </p>
              </div>

              <div className="flex items-center gap-2 self-start md:self-center">
                <button
                  onClick={launchExam}
                  className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs"
                >
                  再測驗一次
                </button>
                <button
                  onClick={() => setStatus('idle')}
                  className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs"
                >
                  離開報告
                </button>
              </div>
            </div>

            {/* 逐行交叉比對明細區 (點擊任一行可在下方檢視原本實際打出的字串，還原影片 05:00 點選反白與下方顯示區) */}
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-4 max-h-[380px] overflow-y-auto font-mono text-sm">
              {examReport.lineResults.map((lr, idx) => {
                const isSelected = selectedReportLineIdx === idx;
                return (
                  <div
                    key={lr.lineNo}
                    onClick={() => setSelectedReportLineIdx(idx)}
                    className={`p-3 rounded-xl border cursor-pointer transition space-y-1.5 ${
                      isSelected
                        ? 'bg-blue-950/60 border-cyan-400'
                        : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    {/* 第一行：原始題目行 */}
                    <div className="text-slate-300 whitespace-pre-wrap break-all">
                      <span className="text-slate-500 mr-2">{String(lr.lineNo).padStart(2, '0')}</span>
                      {lr.targetText}
                    </div>

                    {/* 第二行：智慧對齊後的標記行 (含 * - + @@ ← 與彩色高亮) */}
                    <div className="whitespace-pre-wrap break-all">
                      <span className="text-slate-500 mr-2">{String(lr.lineNo).padStart(2, '0')}</span>
                      {lr.tokens.length > 0 ? (
                        lr.tokens.map((tk, tIdx) => {
                          if (tk.type === 'match') {
                            return <span key={tIdx} className="text-emerald-400">{tk.uChar}</span>;
                          }
                          if (tk.type === 'sub') {
                            return (
                              <span key={tIdx} className="bg-rose-500/30 text-rose-300 font-black px-0.5 rounded" title={`應打「${tk.tChar}」，誤打為「${tk.uChar}」`}>
                                *
                              </span>
                            );
                          }
                          if (tk.type === 'transposed') {
                            return (
                              <span key={tIdx} className="bg-pink-500/30 text-pink-300 font-black px-0.5 rounded" title={`相鄰顛倒：應打「${tk.tChar}」，誤打為「${tk.uChar}」`}>
                                @
                              </span>
                            );
                          }
                          if (tk.type === 'missing') {
                            return (
                              <span key={tIdx} className="bg-amber-500/30 text-amber-300 font-black px-0.5 rounded" title={`漏打「${tk.tChar}」`}>
                                -
                              </span>
                            );
                          }
                          return (
                            <span key={tIdx} className="bg-purple-500/30 text-purple-300 font-black px-0.5 rounded" title={`多打「${tk.uChar}」`}>
                              +
                            </span>
                          );
                        })
                      ) : (
                        <span className="text-slate-600 italic">(本行未輸入)</span>
                      )}
                      {lr.alignedTypedLine.endsWith('←') && (
                        <span className="text-cyan-400 font-black ml-1">←</span>
                      )}
                    </div>

                    {/* 第三行：單行統計列 (`*打對: 52  打錯: 1  漏打: 0  多打: 0  得分: 50  L:3`) */}
                    <div className="text-xs pt-1 border-t border-slate-800/80 flex flex-wrap gap-4 text-slate-300">
                      <span>*打對: <strong className="text-emerald-400">{lr.correct}</strong></span>
                      <span>打錯: <strong className="text-rose-400">{lr.wrong}</strong></span>
                      <span>漏打: <strong className="text-amber-400">{lr.missing}</strong></span>
                      <span>多打: <strong className="text-purple-400">{lr.extra}</strong></span>
                      <span>得分: <strong className="text-cyan-300">{lr.score}</strong></span>
                      <span className="ml-auto text-slate-400">L:{lr.lineNo}</span>
                    </div>
                  </div>
                );
              })}

              {/* 總結橫幅 (還原影片 04:55 `★ 平均速度：243字/分 錯誤率：4/267=2% 測驗時間:1分 2秒`) */}
              <div className="p-3.5 rounded-xl bg-cyan-950/80 border border-cyan-400/60 text-cyan-200 font-bold text-sm flex flex-wrap items-center justify-between gap-2">
                <span>
                  ★ 平均速度：{examReport.cpm} 字/分 　錯誤率：{examReport.totalMistakes}/{examReport.totalCorrect + examReport.totalMistakes}={examReport.errorRate}% 　測驗時間：{Math.floor(examReport.usedSec / 60)}分 {examReport.usedSec % 60}秒
                </span>
                <span className="text-amber-300">總得分：{examReport.totalScore} 分</span>
              </div>
            </div>

            {/* 底部實際原始打字對照檢視窗 (還原影片 05:01 點擊某行時下方顯示學生原本打出的未遮罩字元) */}
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs space-y-1">
              <div className="text-slate-400">
                {selectedReportLineIdx !== null
                  ? `第 ${selectedReportLineIdx + 1} 行您實際輸入的原始字串對照：`
                  : '提示：點擊上方任一行的統計列，可在此檢視您該行原本輸入的原始文字：'}
              </div>
              <div className="text-amber-300 text-sm font-bold min-h-[24px]">
                {selectedReportLineIdx !== null
                  ? examReport.lineResults[selectedReportLineIdx]?.typedText || '(空白)'
                  : '---'}
              </div>
            </div>
          </div>
        )
      )}

      {/* 開始看打前的規則確認彈窗 (100% 還原影片 03:49 彈窗) */}
      {status === 'confirm_modal' && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-slate-900 border-2 border-cyan-400 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 className="text-lg font-black text-cyan-300 flex items-center gap-2">
              <Timer className="w-5 h-5" />
              <span>逐行看打測驗提示</span>
            </h3>
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2.5 text-xs sm:text-sm text-slate-200 leading-relaxed">
              <p>● 計時 <strong className="text-amber-300">{durationMin} 分鐘</strong>，按左上方【逐行看打】開始測驗。</p>
              <p>● 大小寫切換：按左方【CapsLock】或【Shift】鍵。</p>
              <p>● 智慧評分：讀入一行題目，在下方輸入，隨時可修改。</p>
              <p>● 打完一行，按【Enter】跳下一行；最後一行，按【Enter】結束。</p>
              <p className="text-emerald-300 font-semibold">● 打字常有「多打、漏打、錯字…」，本系統採用【智慧、交叉比對】方式能夠【正確評分】！</p>
            </div>
            <div className="flex justify-end gap-3">
              <button
                onClick={() => setStatus('idle')}
                className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
              >
                取消
              </button>
              <button
                onClick={launchExam}
                className="px-6 py-2 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black text-xs"
              >
                確定開始 (Enter)
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// 13. 同目錄外部題庫動態管理與熱掛載中心 (滿足第 2 點要求：同目錄建置、動態載入與擴充)
// ============================================================================
function QuestionBankModal({ manifest, banks, loadStatus, onClose, onHotMountFiles, onAddCustomLesson }) {
  const [targetCatId, setTargetCatId] = useState('en_articles');
  const [newTitle, setNewTitle] = useState('');
  const [newDesc, setNewDesc] = useState('');
  const [newContent, setNewContent] = useState('');
  const [savedNotice, setSavedNotice] = useState('');

  // 匯出單一或全部題庫為同目錄標準 JSON 檔案
  const handleExportJson = (catId) => {
    const data = catId === 'manifest' ? manifest : banks[catId];
    const filename = catId === 'manifest' ? 'manifest.json' : `bank_${catId}.json`;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleCreateLesson = (e) => {
    e.preventDefault();
    if (!newTitle.trim() || !newContent.trim()) return;
    const lines = newContent.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const words = lines.join(' ').split(/\s+/).filter(Boolean);
    const keys = Array.from(new Set(lines.join('').split('')));
    const targetBank = banks[targetCatId];
    const code = `CUST-${(targetBank?.lessons?.length || 0) + 1}`;

    onAddCustomLesson(targetCatId, {
      id: code,
      code,
      title: `${code}: ${newTitle.trim()}`,
      description: newDesc.trim() || '教師自訂擴充課程',
      requiresShiftHint: false,
      keys,
      words,
      lines
    });

    setNewTitle('');
    setNewDesc('');
    setNewContent('');
    setSavedNotice(`已成功新增「${code}: ${newTitle}」至 ${targetBank?.categoryTitle}！`);
  };

  return (
    <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div className="bg-slate-900 border-2 border-cyan-500/60 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-2xl space-y-6">
        <div className="flex items-center justify-between border-b border-slate-800 pb-4">
          <div>
            <h3 className="text-lg sm:text-xl font-black text-white flex items-center gap-2">
              <Database className="w-5 h-5 text-cyan-400" />
              <span>同目錄題庫動態載入與擴充中心 (Same-Directory Asset Architecture)</span>
            </h3>
            <p className="text-xs text-slate-400 mt-1">
              無論英打、中打注音或看打文章，統一存放於應用程式同目錄下（`./manifest.json` 與 `./bank_*.json`），支援熱掛載與無限擴充
            </p>
          </div>
          <button
            onClick={onClose}
            className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
          >
            關閉
          </button>
        </div>

        {/* 同目錄檔案結構與熱掛載區 */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-bold text-cyan-300 uppercase">同目錄題庫檔案清單 (`./`)</span>
              <button
                onClick={() => handleExportJson('manifest')}
                className="text-[11px] text-amber-300 hover:underline flex items-center gap-1"
              >
                <Download className="w-3 h-3" /> 下載 manifest.json
              </button>
            </div>
            <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
              {manifest.categories.map((cat) => (
                <div
                  key={cat.id}
                  className="flex items-center justify-between p-2 rounded-lg bg-slate-900 border border-slate-800 text-xs"
                >
                  <div>
                    <div className="font-bold text-slate-200">{cat.title}</div>
                    <div className="font-mono text-[11px] text-cyan-400">{cat.file} ({banks[cat.id]?.lessons?.length || 0} 課)</div>
                  </div>
                  <button
                    onClick={() => handleExportJson(cat.id)}
                    className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center gap-1"
                  >
                    <Download className="w-3 h-3" /> 匯出 JSON
                  </button>
                </div>
              ))}
            </div>
          </div>

          {/* 動態熱掛載本機同目錄檔案 */}
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
            <div className="space-y-2">
              <span className="text-xs font-bold text-emerald-300 uppercase block">
                動態掛載同目錄題庫檔 (`.json` / `.txt`)
              </span>
              <p className="text-xs text-slate-400 leading-relaxed">
                在部署目錄下放入新的 `bank_*.json` 或純文字文章 `.txt`，系統啟動時會透過 `fetch(manifestUrl)` 自動載入；您也可以直接點選下方按鈕選取本機檔案立即熱掛載！
              </p>
              <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800 font-mono text-[11px] text-cyan-300">
                狀態：{loadStatus.lastSync}
              </div>
            </div>

            <label className="cursor-pointer w-full py-3 px-4 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border-2 border-dashed border-emerald-500/50 text-emerald-300 font-bold text-xs flex items-center justify-center gap-2 transition">
              <Upload className="w-4 h-4" />
              <span>選取本機同目錄 `.json` 或 `.txt` 題庫檔立即載入</span>
              <input
                type="file"
                multiple
                accept=".json,.txt"
                onChange={onHotMountFiles}
                className="hidden"
              />
            </label>
          </div>
        </div>

        {/* 快速線上新增自訂課程/文章並可匯出回存至同目錄 */}
        <form onSubmit={handleCreateLesson} className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
          <div className="flex items-center justify-between">
            <h4 className="text-xs font-bold uppercase text-amber-300 flex items-center gap-1.5">
              <Plus className="w-4 h-4" />
              <span>快速新增擴充題庫 (新增後自動支援四大模式練習，並可匯出 JSON 存回同目錄)</span>
            </h4>
            {savedNotice && <span className="text-xs text-emerald-400 font-bold">{savedNotice}</span>}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label className="text-xs text-slate-400 block mb-1">歸屬題庫分類</label>
              <select
                value={targetCatId}
                onChange={(e) => setTargetCatId(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-white"
              >
                {manifest.categories.map((c) => (
                  <option key={c.id} value={c.id}>{c.title}</option>
                ))}
              </select>
            </div>
            <div>
              <label className="text-xs text-slate-400 block mb-1">新課程標題</label>
              <input
                type="text"
                placeholder="例如：五年級英文單字 Unit 1"
                value={newTitle}
                onChange={(e) => setNewTitle(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
              />
            </div>
            <div>
              <label className="text-xs text-slate-400 block mb-1">課程說明</label>
              <input
                type="text"
                placeholder="例如：課本第 12~15 頁核心句型"
                value={newDesc}
                onChange={(e) => setNewDesc(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
              />
            </div>
          </div>

          <div>
            <label className="text-xs text-slate-400 block mb-1">
              題庫內容（每行代表「逐行看打」的一行；系統會自動拆解出「單字」與「字元」供另外三個遊戲模式使用）
            </label>
            <textarea
              rows={3}
              placeholder="請貼上英文句子、單字清單或中文短文（每行一句）..."
              value={newContent}
              onChange={(e) => setNewContent(e.target.value)}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-white"
            />
          </div>

          <div className="flex justify-end">
            <button
              type="submit"
              className="px-5 py-2 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black text-xs"
            >
              加入題庫並立即啟用
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// 14. 方案 C 預留架構：教師連線與全班成績收集器面板 (TeacherSyncService UI)
// ============================================================================
function TeacherSyncModal({
  connectionMode,
  setConnectionMode,
  studentProfile,
  setStudentProfile,
  scoreHistory,
  banks,
  onDispatchLesson,
  onClose
}) {
  const [dispatchCat, setDispatchCat] = useState('en_finger');
  const [dispatchLesson, setDispatchLesson] = useState('Q-4');

  const exportCsvScores = () => {
    const headers = ['時間,學生,模式,課程代號,速度,錯誤率,得分,同步狀態'];
    const rows = scoreHistory.map(
      (r) => `${r.timestamp},"${r.student}",${r.mode},${r.lesson},${r.speed},${r.errorRate},${r.score},${r.synced ? '已同步' : '本機'}`
    );
    const csvContent = '\uFEFF' + headers.concat(rows).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `校園打字專家_成績收集器_${studentProfile.classId}班.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div className="bg-slate-900 border-2 border-emerald-500/60 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-2xl space-y-5">
        <div className="flex items-center justify-between border-b border-slate-800 pb-4">
          <div>
            <h3 className="text-lg sm:text-xl font-black text-white flex items-center gap-2">
              <Users className="w-5 h-5 text-emerald-400" />
              <span>方案 C 預留架構：教師端連線派題與成績收集器 (`TeacherSyncService`)</span>
            </h3>
            <p className="text-xs text-slate-400 mt-1">
              採用抽象化 Adapter 設計，可無縫切換「單機 LocalStorage」與「區域網路 WebSocket / 雲端 Firebase / Google 試算表後端」
            </p>
          </div>
          <button
            onClick={onClose}
            className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
          >
            關閉
          </button>
        </div>

        {/* 連線狀態切換與設定 */}
        <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <span className="text-xs font-bold text-emerald-300 uppercase">目前通訊協定狀態</span>
            <div className="flex gap-2">
              <button
                onClick={() => setConnectionMode('standalone')}
                className={`px-3 py-1 rounded-lg text-xs font-bold ${
                  connectionMode === 'standalone'
                    ? 'bg-cyan-400 text-slate-950'
                    : 'bg-slate-800 text-slate-400'
                }`}
              >
                單機模式 (LocalStorage)
              </button>
              <button
                onClick={() => setConnectionMode('teacher_sync')}
                className={`px-3 py-1 rounded-lg text-xs font-bold ${
                  connectionMode === 'teacher_sync'
                    ? 'bg-emerald-400 text-slate-950'
                    : 'bg-slate-800 text-slate-400'
                }`}
              >
                與老師連線 (WebSocket / REST 收集器)
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            <div>
              <label className="text-xs text-slate-400 block mb-1">教師端伺服器 Endpoint (升級方案 C 時直接指向後端網址)</label>
              <input
                type="text"
                value={studentProfile.serverUrl}
                onChange={(e) => setStudentProfile({ ...studentProfile, serverUrl: e.target.value })}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-mono text-cyan-300"
              />
            </div>
            <div>
              <label className="text-xs text-slate-400 block mb-1">教室房間代碼 (Room Code)</label>
              <input
                type="text"
                value={studentProfile.roomCode}
                onChange={(e) => setStudentProfile({ ...studentProfile, roomCode: e.target.value })}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-mono text-emerald-300"
              />
            </div>
          </div>
        </div>

        {/* 模擬教師端一鍵統一下發指定測驗題庫 */}
        <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
          <span className="text-xs font-bold text-amber-300 uppercase block">
            教師端模擬控制：一鍵派發指定題庫給學生端
          </span>
          <div className="flex flex-col sm:flex-row gap-3">
            <select
              value={dispatchCat}
              onChange={(e) => {
                setDispatchCat(e.target.value);
                const first = banks[e.target.value]?.lessons?.[0]?.id || '';
                setDispatchLesson(first);
              }}
              className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-white"
            >
              {Object.values(banks).map((b) => (
                <option key={b.categoryId} value={b.categoryId}>{b.categoryTitle}</option>
              ))}
            </select>
            <select
              value={dispatchLesson}
              onChange={(e) => setDispatchLesson(e.target.value)}
              className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-cyan-300"
            >
              {banks[dispatchCat]?.lessons?.map((l) => (
                <option key={l.id} value={l.id}>{l.title}</option>
              ))}
            </select>
            <button
              onClick={() => onDispatchLesson(dispatchCat, dispatchLesson)}
              className="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs flex items-center justify-center gap-1.5"
            >
              <Send className="w-3.5 h-3.5" />
              <span>立即派題至學生端</span>
            </button>
          </div>
        </div>

        {/* 教師端成績收集器列表與 CSV 匯出 (對應原版「校園打字成績收集器.exe」) */}
        <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-cyan-300 uppercase">
              校園打字成績收集器 ({scoreHistory.length} 筆紀錄)
            </span>
            <button
              onClick={exportCsvScores}
              className="px-3 py-1.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center gap-1.5"
            >
              <Download className="w-3.5 h-3.5" />
              <span>匯出全班成績單 (.CSV)</span>
            </button>
          </div>

          <div className="max-h-48 overflow-y-auto">
            <table className="w-full text-left text-xs">
              <thead>
                <tr className="border-b border-slate-800 text-slate-400">
                  <th className="py-1.5 px-2">時間</th>
                  <th className="py-1.5 px-2">班級-學號-姓名</th>
                  <th className="py-1.5 px-2">模式</th>
                  <th className="py-1.5 px-2">課程</th>
                  <th className="py-1.5 px-2 text-right">速度</th>
                  <th className="py-1.5 px-2 text-right">錯誤率</th>
                  <th className="py-1.5 px-2 text-right">得分</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/60 font-mono">
                {scoreHistory.map((r) => (
                  <tr key={r.id}>
                    <td className="py-1.5 px-2 text-slate-400">{r.timestamp}</td>
                    <td className="py-1.5 px-2 text-white font-sans font-semibold">{r.student}</td>
                    <td className="py-1.5 px-2 text-cyan-300 font-sans">{r.mode}</td>
                    <td className="py-1.5 px-2">{r.lesson}</td>
                    <td className="py-1.5 px-2 text-right text-emerald-300">{r.speed}</td>
                    <td className="py-1.5 px-2 text-right text-rose-300">{r.errorRate}</td>
                    <td className="py-1.5 px-2 text-right text-amber-300 font-bold">{r.score}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
